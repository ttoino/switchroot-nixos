name: Build

on:
  push:
    branches: [native-aarch64-ci]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build switchroot image
        run: nix build .#nixosConfigurations.example.config.system.build.switchrootImage
